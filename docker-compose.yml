services:
  portfolio-3d:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-fullstack-3d-portfolio
    ports:
      - "5500:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
